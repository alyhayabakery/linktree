<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>روابط شركتك</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

  body {
    font-family: 'Tajawal', sans-serif;
    background: #d3a273;
    margin: 0;
    padding: 0;
    color: #f8f4e8;
  }

  .container {
    width: 100%;
    max-width: 380px;   /* أهم نقطة: عرض مناسب للموبايل */
    margin: auto;
    padding: 16px;       /* تقليل المسافات */
  }

  .card {
    background: #d3a273;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 0 12px rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.18);
    text-align: center;
  }

  .logo {
    width: 110px;
    border-radius: 50%;
    border: 3px solid #f8f4e8;
    margin-bottom: 14px;
  }

  h2 {
    font-size: 24px;
    margin: 6px 0 10px;
  }

  p {
    font-size: 17px;
    margin: 0 0 16px;
  }

  .btn {
    display: block;
    width: 100%;             /* يمنع خروج الأزرار */
    background: #5c2d35;
    color: #f8f4e8;
    padding: 14px;           /* حجم مناسب */
    margin: 8px 0;           /* مسافات متناسقة */
    border-radius: 10px;
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 0 6px rgba(0,0,0,0.25);
  }

  .btn:hover {
    opacity: 0.9;
  }

  /* موبايل صغير جداً */
  @media (max-width: 400px) {
    .container {
      max-width: 100%;
      padding: 12px;
    }
    .card {
      padding: 16px;
    }
    .logo {
      width: 95px;
    }
    h2 {
      font-size: 22px;
    }
    p {
      font-size: 15px;
    }
    .btn {
      font-size: 16px;
      padding: 12px;
      margin: 7px 0;
    }
  }

</style>
</head>
<body>

<div class="container">
  <div class="card">
    <img src="YOUR_LOGO_URL" class="logo">
    <h2>اسم شركتك</h2>
    <p>وصف مختصر عن خدمات الشركة</p>

    <a href="WHATSAPP_LINK" class="btn">واتساب</a>
    <a href="WEBSITE_LINK" class="btn">الموقع الرسمي</a>
    <a href="INSTAGRAM_LINK" class="btn">انستغرام</a>
    <a href="SERVICES_LINK" class="btn">خدماتنا</a>
  </div>
</div>

</body>
</html>
