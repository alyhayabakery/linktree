<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>روابط شركتك</title>

<!-- خط Tajawal -->
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Tajawal', sans-serif;
    background: #d3a273;
    text-align: center;
    padding: 40px;
    color: #f8f4e8;
    margin: 0;
  }

  .card {
    background: #d3a273;
    padding: 35px;
    border-radius: 22px;
    max-width: 480px;
    margin: auto;
    box-shadow: 0 0 18px rgba(0,0,0,0.25);
    border: 2px solid rgba(255,255,255,0.15);
  }

  .logo {
    width: 140px;
    border-radius: 50%;
    margin-bottom: 20px;
    border: 3px solid #f8f4e8;
  }

  h2 {
    font-size: 28px;
    margin-bottom: 10px;
  }

  p {
    font-size: 20px;
    margin-bottom: 25px;
  }

  .btn {
    display: block;
    padding: 18px;
    margin: 14px 0;
    background: #5c2d35;
    color: #f8f4e8;
    text-decoration: none;
    border-radius: 14px;
    font-size: 20px;
    font-weight: 600;
    box-shadow: 0 0 10px rgba(0,0,0,0.25);
  }

  .btn:hover {
    opacity: 0.85;
  }

  /* ============================
        Responsive Design
     ============================ */

  /* موبايل صغير جداً */
  @media (max-width: 400px) {
    body {
      padding: 15px;
    }
    .card {
      padding: 25px;
      max-width: 100%;
    }
    .logo {
      width: 110px;
    }
    h2 {
      font-size: 24px;
    }
    p {
      font-size: 18px;
    }
    .btn {
      font-size: 18px;
      padding: 15px;
    }
  }

  /* موبايل متوسط */
  @media (max-width: 600px) {
    body {
      padding: 20px;
    }
    .card {
      padding: 30px;
      max-width: 100%;
    }
    .logo {
      width: 120px;
    }
    h2 {
      font-size: 26px;
    }
    p {
      font-size: 19px;
    }
    .btn {
      font-size: 19px;
      padding: 16px;
    }
  }

  /* تابلت */
  @media (max-width: 900px) {
    .card {
      max-width: 520px;
    }
  }

</style>
</head>
<body>

<div class="card">
  <img src="YOUR_LOGO_URL" class="logo">
  <h2>اسم شركتك</h2>
  <p>وصف مختصر عن خدمات الشركة</p>

  <a href="WHATSAPP_LINK" class="btn">واتساب</a>
  <a href="WEBSITE_LINK" class="btn">الموقع الرسمي</a>
  <a href="INSTAGRAM_LINK" class="btn">انستغرام</a>
  <a href="SERVICES_LINK" class="btn">خدماتنا</a>
</div>

</body>
</html>
