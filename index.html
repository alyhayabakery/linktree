<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>روابط شركتك</title>

<!-- استدعاء خط Tajawal -->
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Tajawal', sans-serif; /* الخط الأساسي */
    background: #d3a273; /* الخلفية الأساسية */
    text-align: center;
    padding: 40px;
    color: #f8f4e8; /* أوف وايت */
  }

  .card {
    background: #d3a273; /* نفس لون الخلفية */
    padding: 35px;
    border-radius: 22px;
    max-width: 420px;
    margin: auto;
    box-shadow: 0 0 18px rgba(0,0,0,0.25); /* ظل خفيف */
    border: 2px solid rgba(255,255,255,0.15); /* فصل بسيط */
  }

  .logo {
    width: 120px;
    border-radius: 50%;
    margin-bottom: 15px;
    border: 3px solid #f8f4e8;
  }

  .btn {
    display: block;
    padding: 15px;
    margin: 12px 0;
    background: #5c2d35; /* لون الأزرار */
    color: #f8f4e8; /* النص داخل الأزرار */
    text-decoration: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    box-shadow: 0 0 10px rgba(0,0,0,0.25);
  }

  .btn:hover {
    opacity: 0.85;
  }
</style>
</head>
<body>

<div class="card">
  <img src="YOUR_LOGO_URL" class="logo">
  <h2>اسم شركتك</h2>
  <p>وصف مختصر عن خدمات الشركة</p>

  <a href="WHATSAPP_LINK" class="btn">واتساب</a>
  <a href="WEBSITE_LINK" class="btn">الموقع الرسمي</a>
  <a href="INSTAGRAM_LINK" class="btn">انستغرام</a>
  <a href="SERVICES_LINK" class="btn">خدماتنا</a>
</div>

</body>
</html>
