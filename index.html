<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>روابط شركتك</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

  /* الأساس: تصميم للموبايل أولاً */
  body {
    font-family: 'Tajawal', sans-serif;
    background: #d3a273;
    margin: 0;
    padding: 0;
    color: #f8f4e8;
  }

  .container {
    width: 100%;
    max-width: 420px;
    margin: auto;
    padding: 20px;
  }

  .card {
    background: #d3a273;
    padding: 18px;
    border-radius: 16px;
    box-shadow: 0 0 12px rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.18);
    text-align: center;
  }

  .logo {
    width: 130px;
    border-radius: 50%;
    border: 3px solid #f8f4e8;
    margin-bottom: 12px;
  }

  h2 {
    font-size: 26px;
    margin: 8px 0;
  }

  p {
    font-size: 18px;
    margin: 6px 0 18px;
  }

  .btn {
    display: block;
    width: 100%;
    background: #5c2d35;
    color: #f8f4e8;
    padding: 14px;
    margin: 10px 0;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 0 8px rgba(0,0,0,0.25);
  }

  .btn:hover {
    opacity: 0.9;
  }

  /* شاشات أكبر من الموبايل */
  @media (min-width: 480px) {
    .container {
      max-width: 480px;
      padding: 30px;
    }
    .card {
      padding: 25px;
    }
    h2 { font-size: 28px; }
    p { font-size: 20px; }
    .btn { font-size: 19px; padding: 15px; }
  }

  /* التابلت */
  @media (min-width: 768px) {
    .container {
      max-width: 520px;
    }
    .card {
      padding: 30px;
    }
    .logo { width: 150px; }
  }

  /* الكمبيوتر */
  @media (min-width: 1024px) {
    .container {
      max-width: 540px;
    }
  }

</style>
</head>
<body>

<div class="container">
  <div class="card">
    <img src="YOUR_LOGO_URL" class="logo">
    <h2>اسم شركتك</h2>
    <p>وصف مختصر عن خدمات الشركة</p>

    <a href="WHATSAPP_LINK" class="btn">واتساب</a>
    <a href="WEBSITE_LINK" class="btn">الموقع الرسمي</a>
    <a href="INSTAGRAM_LINK" class="btn">انستغرام</a>
    <a href="SERVICES_LINK" class="btn">خدماتنا</a>
  </div>
</div>

</body>
</html>
