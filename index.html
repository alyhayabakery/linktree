<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>روابط شركتك</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

  /* تصميم للموبايل أولاً */
  body {
    font-family: 'Tajawal', sans-serif;
    background: #d3a273;
    margin: 0;
    padding: 0;
    color: #f8f4e8;
  }

  .container {
    width: 100%;
    max-width: 360px; /* أصغر = أوضح على الموبايل */
    margin: auto;
    padding: 18px;
  }

  .card {
    background: #d3a273;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 0 12px rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.18);
    text-align: center;
  }

  .logo {
    width: 115px;
    border-radius: 50%;
    border: 3px solid #f8f4e8;
    margin-bottom: 14px;
  }

  h2 {
    font-size: 24px;
    margin: 6px 0 10px;
  }

  p {
    font-size: 17px;
    margin: 0 0 18px;
  }

  .btn {
    display: block;
    width: 100%;
    background: #5c2d35;
    color: #f8f4e8;
    padding: 13px;
    margin: 8px 0;
    border-radius: 10px;
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 0 6px rgba(0,0,0,0.25);
  }

  .btn:hover {
    opacity: 0.9;
  }

  /* موبايل متوسط */
  @media (min-width: 400px) {
    .container {
      max-width: 400px;
      padding: 22px;
    }
    .btn {
      font-size: 18px;
      padding: 14px;
    }
    h2 { font-size: 26px; }
    p { font-size: 18px; }
  }

  /* تابلت */
  @media (min-width: 768px) {
    .container {
      max-width: 480px;
      padding: 28px;
    }
    .card {
      padding: 28px;
    }
    .logo { width: 140px; }
    .btn { font-size: 19px; padding: 15px; }
  }

  /* كمبيوتر */
  @media (min-width: 1024px) {
    .container {
      max-width: 520px;
    }
  }

</style>
</head>
<body>

<div class="container">
  <div class="card">
    <img src="YOUR_LOGO_URL" class="logo">
    <h2>اسم شركتك</h2>
    <p>وصف مختصر عن خدمات الشركة</p>

    <a href="WHATSAPP_LINK" class="btn">واتساب</a>
    <a href="WEBSITE_LINK" class="btn">الموقع الرسمي</a>
    <a href="INSTAGRAM_LINK" class="btn">انستغرام</a>
    <a href="SERVICES_LINK" class="btn">خدماتنا</a>
  </div>
</div>

</body>
</html>
