<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>روابط شركتك</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Tajawal', sans-serif;
    background: #d3a273;
    margin: 0;
    padding: 0;
    color: #f8f4e8;
    display: flex;
    justify-content: center;
    align-items: flex-start; /* يخلي الكارد يطلع فوق شوي */
    min-height: 100vh;
    padding-top: 20px;       /* يقلل المسافة فوق */
  }

  .card {
    background: #d3a273;
    width: 95%;              /* يكبر الكارد على الموبايل */
    max-width: 450px;        /* أكبر من قبل */
    padding: 26px 20px;      /* مسافات داخلية متناسقة */
    border-radius: 18px;
    box-shadow: 0 0 14px rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.18);
    text-align: center;
  }

  .logo {
    width: 130px;
    border-radius: 50%;
    border: 3px solid #f8f4e8;
    margin-bottom: 16px;
  }

  h2 {
    font-size: 26px;
    margin: 10px 0;
  }

  p {
    font-size: 18px;
    margin: 0 0 20px;
  }

  .btn-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px; /* مسافة بين الأزرار */
  }

  .btn {
    flex: 0 0 48%; /* 50% تقريبًا */
    background: #5c2d35;
    color: #f8f4e8;
    padding: 14px;
    border-radius: 10px;
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 0 8px rgba(0,0,0,0.25);
  }

  /* موبايل صغير جداً */
  @media (max-width: 400px) {
    .card {
      width: 100%;
      padding: 20px 16px;
    }
    .logo {
      width: 110px;
    }
    h2 {
      font-size: 22px;
    }
    p {
      font-size: 16px;
    }
    .btn {
      font-size: 16px;
      padding: 12px;
    }
  }
</style>
</head>
<body>

<div class="card">
  <img src="YOUR_LOGO_URL" class="logo">
  <h2>اسم شركتك</h2>
  <p>وصف مختصر عن خدمات الشركة</p>

  <div class="btn-container">
    <a href="WHATSAPP_LINK" class="btn">واتساب</a>
    <a href="WEBSITE_LINK" class="btn">الموقع الرسمي</a>
    <a href="INSTAGRAM_LINK" class="btn">انستغرام</a>
    <a href="SERVICES_LINK" class="btn">خدماتنا</a>
  </div>
</div>

</body>
</html>
