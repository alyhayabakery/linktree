<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>روابط شركتك</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Tajawal', sans-serif;
    background: #d3a273;
    text-align: center;
    padding: 20px;
    color: #f8f4e8;
    margin: 0;
  }

  .card {
    background: #d3a273;
    padding: 20px;
    border-radius: 18px;
    max-width: 380px;
    margin: 0 auto;
    box-shadow: 0 0 14px rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.18);
  }

  .logo {
    width: 110px;
    border-radius: 50%;
    margin-bottom: 12px;
    border: 3px solid #f8f4e8;
  }

  h2 {
    font-size: 22px;
    margin: 6px 0 8px;
  }

  p {
    font-size: 16px;
    margin: 0 0 14px;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    background: #5c2d35;
    color: #f8f4e8;
    text-decoration: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    box-shadow: 0 0 8px rgba(0,0,0,0.25);
  }

  .btn:hover {
    opacity: 0.9;
  }

  /* موبايل صغير جداً */
  @media (max-width: 400px) {
    body {
      padding: 12px;
    }
    .card {
      padding: 16px;
      max-width: 100%;
    }
    .logo {
      width: 95px;
    }
    h2 {
      font-size: 20px;
    }
    p {
      font-size: 15px;
    }
    .btn {
      font-size: 15px;
      padding: 11px;
      margin: 7px 0;
    }
  }
</style>
</head>
<body>

<div class="card">
  <img src="YOUR_LOGO_URL" class="logo">
  <h2>اسم شركتك</h2>
  <p>وصف مختصر عن خدمات الشركة</p>

  <a href="WHATSAPP_LINK" class="btn">واتساب</a>
  <a href="WEBSITE_LINK" class="btn">الموقع الرسمي</a>
  <a href="INSTAGRAM_LINK" class="btn">انستغرام</a>
  <a href="SERVICES_LINK" class="btn">خدماتنا</a>
</div>

</body>
</html>
