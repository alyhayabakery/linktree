<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>روابط شركتك</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

  body {
    font-family: 'Tajawal', sans-serif;
    background: #d3a273;
    margin: 0;
    padding: 0;
    color: #f8f4e8;
  }

  .wrapper {
    width: 100%;
    padding: 0;
    margin: 0;
  }

  .card {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    background: #d3a273;
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 0 14px rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.18);
    text-align: center;
  }

  .logo {
    width: 120px;
    border-radius: 50%;
    border: 3px solid #f8f4e8;
    margin-bottom: 16px;
  }

  h2 {
    font-size: 26px;
    margin: 10px 0;
  }

  p {
    font-size: 18px;
    margin: 0 0 20px;
  }

  .btn {
    display: block;
    width: 100%;
    background: #5c2d35;
    color: #f8f4e8;
    padding: 15px;
    margin: 10px 0;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 0 8px rgba(0,0,0,0.25);
  }

  .btn:hover {
    opacity: 0.9;
  }

  /* موبايل صغير جداً */
  @media (max-width: 400px) {
    .card {
      padding: 18px;
      max-width: 100%;
    }
    .logo {
      width: 100px;
    }
    h2 {
      font-size: 22px;
    }
    p {
      font-size: 16px;
    }
    .btn {
      font-size: 16px;
      padding: 13px;
      margin: 8px 0;
    }
  }

</style>
</head>
<body>

<div class="wrapper">
  <div class="card">
    <img src="YOUR_LOGO_URL" class="logo">
    <h2>اسم شركتك</h2>
    <p>وصف مختصر عن خدمات الشركة</p>

    <a href="WHATSAPP_LINK" class="btn">واتساب</a>
    <a href="WEBSITE_LINK" class="btn">الموقع الرسمي</a>
    <a href="INSTAGRAM_LINK" class="btn">انستغرام</a>
    <a href="SERVICES_LINK" class="btn">خدماتنا</a>
  </div>
</div>

</body>
</html>
