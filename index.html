<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>روابط شركتك</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Tajawal', sans-serif;
    background: #d3a273;
    margin: 0;
    padding: 0;
    color: #f8f4e8;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .card {
    background: #d3a273;
    width: 90%;
    max-width: 400px;
    padding: 22px 18px;
    border-radius: 18px;
    box-shadow: 0 0 14px rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.18);
    text-align: center;
  }

  .logo {
    width: 120px;
    border-radius: 50%;
    border: 3px solid #f8f4e8;
    margin-bottom: 14px;
  }

  h2 {
    font-size: 24px;
    margin: 8px 0;
  }

  p {
    font-size: 17px;
    margin: 0 0 18px;
  }

  .btn {
    display: block;
    width: 100%;
    background: #5c2d35;
    color: #f8f4e8;
    padding: 14px;
    margin: 10px 0;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 0 8px rgba(0,0,0,0.25);
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .btn:hover {
    transform: scale(1.02);
    opacity: 0.9;
  }

  /* تحسينات للموبايل الصغير */
  @media (max-width: 400px) {
    .card {
      width: 95%;
      padding: 18px 14px;
    }
    .logo {
      width: 100px;
      margin-bottom: 10px;
    }
    h2 {
      font-size: 22px;
    }
    p {
      font-size: 15px;
      margin-bottom: 14px;
    }
    .btn {
      font-size: 16px;
      padding: 12px;
      margin: 8px 0;
    }
  }

  /* تحسينات للتابلت */
  @media (min-width: 768px) {
    .card {
      max-width: 460px;
      padding: 26px 22px;
    }
    .logo {
      width: 140px;
    }
    h2 { font-size: 26px; }
    p { font-size: 18px; }
    .btn { font-size: 18px; padding: 14px; }
  }
</style>
</head>
<body>

<div class="card">
  <img src="YOUR_LOGO_URL" class="logo">
  <h2>اسم شركتك</h2>
  <p>وصف مختصر عن خدمات الشركة</p>

  <a href="WHATSAPP_LINK" class="btn">واتساب</a>
  <a href="WEBSITE_LINK" class="btn">الموقع الرسمي</a>
  <a href="INSTAGRAM_LINK" class="btn">انستغرام</a>
  <a href="SERVICES_LINK" class="btn">خدماتنا</a>
</div>

</body>
</html>
